name: CI

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: |
          chmod +x ./mvnw
          ./mvnw -DskipTests package

      - name: Test
        run: ./mvnw test

      - name: PostgreSQL integration test
        run: ./mvnw -Dit.test=ReportingPostgresEnumIT verify

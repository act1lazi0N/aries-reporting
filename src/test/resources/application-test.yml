spring:
  autoconfigure:
    exclude: org.springframework.boot.quartz.autoconfigure.QuartzAutoConfiguration

  # H2 in-memory - no real PostgreSQL instance required
  # Dual datasource uses 2 separate H2 databases
  # TestDataSourceConfig.java wires 2 beans instead of DataSourceConfig.java
  datasource:
    url: jdbc:h2:mem:reporting_repo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password:
    driver-class-name: org.h2.Driver

    reporting:
      url: jdbc:h2:mem:reporting_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: ReportingTestPool

    transaction:
      url: jdbc:h2:mem:transaction_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: TransactionTestPool

  # JPA - automatically creates the schema from entities
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # Flyway disabled - H2 uses ddl-auto
  flyway:
    enabled: false

  # Redis
  data:
    redis:
      host: localhost
      port: 6370

  # Mail - fake SMTP
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

  # Quartz - in-memory, no JDBC store required
  quartz:
    job-store-type: memory

# JWT - test secret, do not use outside CI
jwt:
  secret: dGVzdFNlY3JldEtleUZvckp3dFRlc3RpbmdQdXJwb3Nlc09ubHk=
  issuer: aries-transaction
  audience: aries-transaction-api
  token-type: access
  clock-skew-seconds: 30

# App
app:
  reporting:
    export-dir: /tmp/aries-test-exports
    export-ttl-hours: 1
    mail-from: test@aries.local
    cache-ttl-minutes: 1

# Logging
logging:
  level:
    com.actilazion: WARN
    org.springframework: WARN
    org.hibernate: WARN

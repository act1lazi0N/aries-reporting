spring:
  # H2 in-memory — không cần PostgreSQL thật
  # Dual datasource dùng 2 H2 database riêng biệt
  # TestDataSourceConfig.java wire 2 bean thay vì DataSourceConfig.java
  datasource:
    reporting:
      url:               jdbc:h2:mem:reporting_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      username:          sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: ReportingTestPool

    transaction:
      url:               jdbc:h2:mem:transaction_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      username:          sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: TransactionTestPool

  # JPA — tạo schema tự động từ entity
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect:    org.hibernate.dialect.H2Dialect
        format_sql: false

  # Flyway tắt — H2 dùng ddl-auto
  flyway:
    enabled: false

  # Redis
  data:
    redis:
      host: localhost
      port: 6370

  # Mail — fake SMTP
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

  # Quartz — in-memory, không cần JDBC store
  quartz:
    job-store-type: memory

# JWT — test secret, không dùng ngoài CI
jwt:
  secret: dGVzdFNlY3JldEtleUZvckp3dFRlc3RpbmdQdXJwb3Nlc09ubHk=

# App
app:
  reporting:
    export-dir:        /tmp/aries-test-exports
    export-ttl-hours:  1
    mail-from:         test@aries.local
    cache-ttl-minutes: 1

# Logging
logging:
  level:
    com.actilazion:       WARN
    org.springframework:  WARN
    org.hibernate:        WARN

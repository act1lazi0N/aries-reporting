services:
  postgres-reporting:
    image: postgres:16-alpine
    container_name: aries_reporting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aries_reporting_db
      POSTGRES_USER:     reporting_user
      POSTGRES_PASSWORD: reporting_pass
    ports:
      - "5433:5432"
    volumes:
      - reporting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting_user -d aries_reporting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - reporting_net

  redis-reporting:
    image: redis:7-alpine
    container_name: aries_reporting_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"   # 6379 is already used by the Transfer System
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reporting_net

  reporting-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aries_reporting_app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_REPORTING_URL:      jdbc:postgresql://postgres-reporting:5432/aries_reporting_db
      SPRING_DATASOURCE_REPORTING_USERNAME: reporting_user
      SPRING_DATASOURCE_REPORTING_PASSWORD: reporting_pass

      SPRING_DATASOURCE_TRANSACTION_URL:      jdbc:postgresql://host.docker.internal:5432/aries_transaction_db
      SPRING_DATASOURCE_TRANSACTION_USERNAME: transfer_user
      SPRING_DATASOURCE_TRANSACTION_PASSWORD: transfer_pass

      SPRING_DATA_REDIS_HOST: redis-reporting
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

      MAIL_HOST:     ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT:     ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM:     ${MAIL_FROM:-noreply@aries.local}

      EXPORT_DIR: /app/exports
      SPRING_PROFILES_ACTIVE: docker

    volumes:
      - export_files:/app/exports
    depends_on:
      postgres-reporting:
        condition: service_healthy
      redis-reporting:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - reporting_net
    extra_hosts:
      - "host.docker.internal:host-gateway"   # access the host from the container

volumes:
  reporting_postgres_data:
  export_files:

networks:
  reporting_net:
    driver: bridge
